# 使い切り: GSC インデックス登録の「障害箇所」（トークン取得 / index.update）だけを
# 切り出して検証するための専用ワークフロー。
#
# - workflow_dispatch のみ。schedule / push / pull_request には反応しない。
# - 本番の deploy.yml とは別物。記事生成・デプロイは行わない。
# - 目的: run 39092902792 で出た
#     google.auth.exceptions.RefreshError: ('No access token in response.', ...)
#   を隔離再現し、GSC_SA_JSON（サービスアカウント）側の問題か確認する。
name: GSC verify (manual only)

on:
  workflow_dispatch:

jobs:
  gsc-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (google-auth + requests)
        run: python -m pip install --upgrade pip && pip install google-auth requests

      - name: Diagnose token refresh (isolated)
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: |
          python - <<'PY'
          import json, os, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession, Request

          sa = json.loads(os.environ["GSC_SA_JSON"])
          print("SA type        :", sa.get("type"))
          print("client_email   :", sa.get("client_email"))
          print("token_uri      :", sa.get("token_uri"))
          print("has private_key:", bool(sa.get("private_key")))

          creds = service_account.Credentials.from_service_account_info(
              sa, scopes=["https://www.googleapis.com/auth/searchconsole"])
          print("creds class    :", type(creds).__name__)

          try:
              creds.refresh(Request())
              tok = creds.token or ""
              print("REFRESH OK     : token len", len(tok), "prefix", tok[:15])
              # トークンが実 GSC API で通るか（読み取り専用の sites.get）
              sess = AuthorizedSession(creds)
              r = sess.get(
                  "https://searchconsole.googleapis.com/v1/sites/"
                  "https%3A%2F%2Fbwdsf3104.github.io%2Fmy-auto-blog%2F",
                  timeout=30)
              print("sites.get      :", r.status_code, r.text[:300])
          except Exception as e:
              print("REFRESH FAILED :", type(e).__module__ + "." + type(e).__name__)
              print("detail         :", repr(e))
              sys.exit(1)
          PY

      - name: Run actual gsc_index.py
        if: always()
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: python scripts/gsc_index.py
