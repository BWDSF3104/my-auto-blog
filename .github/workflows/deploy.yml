name: Auto Generate Content and Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 23 * * *' # 毎日 日本時間 8:00 に実行
  workflow_dispatch: # 手動実行用

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # --- 1. AI記事生成 ＆ Git Commit ---
# --- 1. AI記事生成 ＆ Git Commit ---
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai gradio_client

      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROMPT_TYPE: "ai_deep"
        run: |
          python scripts/generate_article.py

      - name: Commit and push generated article and images
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # ディレクトリを安全に追加
          git add src/content/posts/
          [ -d "public/images" ] && git add public/images/
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-generated daily post with image [skip ci]" && git push)          

  # --- 2. Astroサイト構築 ＆ GitHub Pagesへ配信 ---
  build-and-deploy:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4