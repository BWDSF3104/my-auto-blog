name: Auto Generate Content and Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 23 * * *' # 毎日 日本時間 8:00 に実�?
  workflow_dispatch: # 手動実行用

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # --- 1. AI記事生�? ?�? Git Commit ---
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install google-genai gradio_client pillow pillow-avif-plugin

      # -------------------------------------------------------
      # 1-A. 設定不要ソースからトレンドトピックを収�?
      #      ?�?HackerNews / Reddit / e621 / RSS / GitHub Search?�?
      #      出�?: data/latest_topics.json
      # -------------------------------------------------------
      - name: Fetch trending topics (no API key required)
        env:
          # GITHUB_TOKEN は Actions �?で自動提供される?��レート制限緩�?: 1,000req/h?�?
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          python scripts/fetch_topics.py

      # -------------------------------------------------------
      # 1-B. Gemini でケモノ小説を生�?
      #      fetch_topics.py が生成し�? data/latest_topics.json を参照してトレンドを注入
      # -------------------------------------------------------
      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROMPT_TYPE: "kemono_story"
        run: |
          python scripts/generate_article.py

      - name: Commit and push generated article and images
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # �?ィレクトリを安�?�に追�?
          git add src/content/posts/
          [ -d "public/images" ] && git add public/images/
          # トレンドJSONもコミット（差�?確認用・任意�?
          [ -f "data/latest_topics.json" ] && git add data/latest_topics.json
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-generated daily post with image [skip ci]" && git push)          

  # --- 2. Astroサイト構�? ?�? GitHub Pagesへ配信 ---
  build-and-deploy:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4