name: Auto Generate Content and Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 23 * * *' # JST morning 8:00
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # --- 1. AI article generation + Git Commit ---
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install google-genai gradio_client pillow pillow-avif-plugin

      # -------------------------------------------------------
      # 1-A. Fetch trending topics from multiple sources
      #      Sources: HackerNews / Reddit / e621 / RSS / GitHub Search
      #      Output: data/topics/{timestamp}.json + data/topics/latest.json symlink
      # -------------------------------------------------------
      - name: Fetch trending topics (no API key required)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_TYPE: "kemono_story"
        run: |
          mkdir -p data
          python scripts/fetch_topics.py --prompt-type "$PROMPT_TYPE"

      # -------------------------------------------------------
      # 1-B. Pre-score trends & copyrights with Clef-flash
      #      Output: data/genre_scores/topics.json (genre fit scores)
      #      Failure is non-fatal: generate_article.py falls back
      #      to random selection when the score file is absent.
      # -------------------------------------------------------
      - name: Pre-score trends (Clef-flash)
        id: genre_score
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          from genre_score import score_topics
          result = score_topics()
          print(f'Scored: {len(result[\"topics\"])} topics, {len(result[\"copyrights\"])} copyrights')
          print(f'API calls: {result[\"api_calls\"]}, Cache hits: {result[\"cache_hits\"]}')
          "

      # -------------------------------------------------------
      # 1-C. Generate article with Gemini
      #      Reads topics from data/topics/latest.json symlink
      #      + genre scores from data/genre_scores/topics.json
      # -------------------------------------------------------
      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AMAZON_TRACKING_ID: ${{ secrets.AMAZON_TRACKING_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          PROMPT_TYPE: "kemono_story"
        run: |
          python scripts/generate_article.py

      - name: Commit and push generated article and images
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Safely add generated directories
          git add src/content/posts/
          [ -d "public/images" ] && git add public/images/
          # Cache JSON (timestamped file + latest.json copy)
          [ -d "data/topics" ] && git add data/topics/
          # Trend usage logs
          [ -d "data/trend_usage" ] && git add data/trend_usage/
          # 2-pass draft metadata
          [ -d "data/drafts" ] && git add data/drafts/
           # Rakuten API product cache (30-day TTL)
           [ -f "data/rakuten_cache.json" ] && git add data/rakuten_cache.json
           # Used prompt logs (traceability)
           [ -d "data/prompt_logs" ] && git add data/prompt_logs/
           # Genre score cache + results (CI reuse + traceability)
           [ -d "data/genre_scores" ] && git add data/genre_scores/

          git diff --quiet && git diff --staged --quiet || {
            git commit -m "docs: auto-generated daily post with image and draft metadata [skip ci]"
            # Staging again to catch any remaining unstaged changes (e.g. cleanup deletions)
            git add -A
            git diff --staged --quiet || git commit -m "chore: cleanup old topic files [skip ci]"
            git pull --rebase || git pull --no-edit
            git push
          }          

  # --- 2. Astro site build + deploy to GitHub Pages ---
  build-and-deploy:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
