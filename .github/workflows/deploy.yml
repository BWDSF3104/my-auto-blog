name: Auto Generate Content and Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 23 * * *' # 毎日 日本時間 8:00 に実行
  workflow_dispatch: # 手動実行用

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # --- 1. AI記事生成 ＆ Git Commit ---
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Python 3.11以上を指定

      - name: Install dependencies
        run: |
          pip install google-genai # 最新SDKをインストール

      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_article.py

      - name: Commit and push generated article
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/pages/posts/
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-generated daily post [skip ci]" && git push)

  # --- 2. Astroサイト構築 ＆ GitHub Pagesへ配信 ---
  build-and-deploy:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4